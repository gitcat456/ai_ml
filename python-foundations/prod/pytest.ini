[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short test IDs and local variables on failure
addopts = -v --tb=short

# Markers
markers =
    llm: marks tests that make real LLM calls (deselect with -m "not llm")
    retrieval: marks tests that require the local knowledge index
